<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2263D2">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<title>COSMOS TOOLS · COSMOS COOKIE LAB</title>
<link href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Golos+Text:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--blue:#2263D2;--cream:#F6F4F1;--red:#D22222;--line:#d4d1cc}
*{box-sizing:border-box}
html{min-height:100%;background:var(--blue)}
body{position:relative;isolation:isolate;margin:0;min-height:100vh;background:var(--blue);color:var(--blue);font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-weight:500;letter-spacing:-.45px;line-height:1;display:flex;flex-direction:column;overflow-x:hidden}
body:before,body:after{content:"";position:fixed;inset:-35%;z-index:-1;pointer-events:none;background-repeat:repeat;animation:star-drift 95s linear infinite}
body:before{opacity:.78;background-image:radial-gradient(1px 1px at 13px 19px,#fff 98%,transparent),radial-gradient(1px 1px at 77px 53px,#dce8ff 98%,transparent),radial-gradient(1px 1px at 141px 117px,#fff 98%,transparent),radial-gradient(1px 1px at 193px 31px,#c8dcff 98%,transparent),radial-gradient(1px 1px at 231px 181px,#fff 98%,transparent);background-size:257px 211px}
body:after{opacity:.38;background-image:radial-gradient(1px 1px at 31px 83px,#fff 98%,transparent),radial-gradient(1px 1px at 119px 17px,#e8efff 98%,transparent),radial-gradient(1px 1px at 207px 143px,#fff 98%,transparent);background-size:293px 239px;animation-duration:145s;animation-direction:reverse}
@keyframes star-drift{from{transform:translate3d(0,0,0)}to{transform:translate3d(7%,5%,0)}}
@keyframes letter-wobble{0%,100%{transform:translate(1px,-.5px)}25%{transform:translate(-.5px,.7px)}50%{transform:translate(1.2px,.5px)}75%{transform:translate(.2px,-1px)}}
main{position:relative;width:min(320px,calc(100% - 32px));min-height:calc(100vh - 64px);margin:32px auto;padding:34px 27px 25px;flex:1;display:flex;flex-direction:column;justify-content:center;background:var(--cream);border:1px solid #fff;box-shadow:0 10px 35px #102f6a30}
.topline{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:58px}
.brand{font-size:14px;letter-spacing:-.35px;font-weight:500;color:var(--blue)}
.logo-type{position:relative;display:inline-block;color:transparent;-webkit-text-stroke:.65px var(--blue);font-weight:500}
.logo-type:after{content:attr(data-text);position:absolute;inset:0;color:#2263D269;-webkit-text-stroke:0;transform:translate(2px,1.5px);filter:url(#letter-wiggle);animation:letter-wobble 2.7s ease-in-out infinite;pointer-events:none}
h1{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:clamp(44px,11vw,66px);line-height:.9;letter-spacing:-2.5px;margin:0;color:var(--blue);font-weight:500}
h1 .logo-type{display:block;width:max-content}
.subtitle{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:10px;font-weight:400;letter-spacing:-.5px;color:var(--blue);margin:18px 0 48px;line-height:1;text-align:justify}
.tools{display:grid;grid-template-columns:1fr;gap:22px;max-width:100%;margin:0 auto;width:100%}.tools[hidden]{display:none}
.tool-link{position:relative;display:flex;align-items:center;justify-content:center;min-height:68px;padding:17px 28px;text-decoration:none;text-align:justify;color:var(--blue);font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:12px;font-weight:500;letter-spacing:-.4px;line-height:1;border:1px solid #aaa8a3;border-radius:10px;background:linear-gradient(180deg,#fff 0%,#f0efed 18%,#d8d7d4 48%,#c5c4c1 52%,#e6e5e2 82%,#c9c8c5 100%);box-shadow:inset 0 2px 1px #fff,inset 0 -2px 2px #aaa9a6,0 4px 0 #a5a39e,0 7px 12px #00000012;transition:transform .12s ease,box-shadow .12s ease}
.tool-link:before{content:"★";position:absolute;left:14px;top:50%;transform:translateY(-52%);font-size:11px;color:var(--blue)}
.tool-link:hover{filter:brightness(1.035);transform:translateY(-1px);box-shadow:inset 0 2px 1px #fff,inset 0 -2px 2px #aaa9a6,0 5px 0 #a5a39e,0 9px 14px #00000016}
.tool-link:active{transform:translateY(3px);box-shadow:inset 0 2px 1px #fff,0 1px 0 #a5a39e,0 3px 7px #00000012}
.account-area{position:relative}
.account-button,.account-actions button,#accountLogout{border:1px solid #aaa8a3;border-radius:8px;background:linear-gradient(180deg,#fff 0%,#f0efed 18%,#d8d7d4 48%,#c5c4c1 52%,#e6e5e2 82%,#c9c8c5 100%);color:var(--blue);font:500 10px 'Helvetica Neue',Helvetica,Arial,sans-serif;letter-spacing:-.4px;line-height:1;padding:9px 12px;box-shadow:inset 0 2px 1px #fff,0 3px 0 #a5a39e;cursor:pointer}
.account-button:active,.account-actions button:active,#accountLogout:active{background:linear-gradient(180deg,#dce8fb,#aebfdb 55%,#9fb3d5);transform:translateY(2px);box-shadow:inset 0 2px 1px #fff,0 1px 0 #929eaf}
.account-panel{position:absolute;right:0;top:calc(100% + 12px);z-index:20;width:min(310px,calc(100vw - 56px));padding:17px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px #00000018;text-align:justify}
.account-panel[hidden]{display:none}
.account-heading{font-size:10px;font-weight:800;letter-spacing:-.5px;color:var(--blue);margin-bottom:13px}
.account-panel label{display:block;font-size:10px;font-weight:500;letter-spacing:-.4px;color:var(--blue);margin:10px 0 5px}
.account-panel input{width:100%;padding:11px;border:1px solid var(--line);border-radius:6px;font:500 12px 'Helvetica Neue',Helvetica,Arial,sans-serif;letter-spacing:-.4px;color:var(--blue);background:#fff}
.account-actions{display:flex;gap:8px;margin-top:12px}
.account-user,.account-status{font-size:10px;line-height:1.2;color:var(--blue);overflow-wrap:anywhere}
.account-status{min-height:14px;margin:10px 0 0}
footer{text-align:center;padding:55px 8px 0;margin-top:auto;display:grid;gap:7px}
footer .stars{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:26px;line-height:1;letter-spacing:-.7px;color:var(--blue);font-weight:500}
footer .tagline{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:10px;line-height:1.15;letter-spacing:-.25px;font-weight:400;color:var(--blue)}
footer .est{font-family:'Gochi Hand',cursive;font-size:14px;letter-spacing:-.5px;color:var(--red)}
@media(max-width:420px){main{width:calc(100% - 48px);min-height:calc(100svh - 32px);margin:16px auto;padding:27px 22px 22px}.topline{margin-bottom:48px}.subtitle{margin-bottom:39px}footer{padding-top:45px}}
@media(prefers-reduced-motion:reduce){body:before,body:after,.logo-type:after{animation:none}}
@media(max-width:420px){main{width:calc(100% - 48px)}}
</style>
<style>
/* RODAPÉ PADRÃO COSMOS, IGUAL AO RECIPE CALCULATOR */
.footer-cosmos{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;width:100%;padding:28px 12px 20px;gap:3px;background:transparent}
.footer-cosmos .line-brand{font-size:26px;font-weight:500;letter-spacing:-.7px;line-height:1;color:var(--blue)}
.footer-cosmos .line-tagline{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:10px;font-weight:400;letter-spacing:-.25px;line-height:1.15;color:var(--blue)}
.footer-cosmos .line-est{font-family:'Gochi Hand',cursive;font-size:9px;font-weight:400;letter-spacing:0;line-height:1.1;color:#D22222}
@media(max-width:520px){.footer-cosmos .line-brand{font-size:26px}}
</style>
</head>
<body>
<svg aria-hidden="true" width="0" height="0" style="position:absolute"><filter id="letter-wiggle"><feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="1" seed="8" result="noise"><animate attributeName="baseFrequency" values=".025;.045;.03;.025" dur="5s" repeatCount="indefinite"/></feTurbulence><feDisplacementMap in="SourceGraphic" in2="noise" scale="2.4" xChannelSelector="R" yChannelSelector="G"/></filter></svg>
<main>
<div class="topline"><div class="brand"><span class="logo-type" data-text="COSMOS COOKIE LAB">COSMOS COOKIE LAB</span></div><div class="account-area">
<button class="account-button" id="accountToggle" type="button">LOGIN</button>
<div class="account-panel" id="accountPanel" hidden>
<div class="account-heading" id="accountHeading">CONTA COSMOS</div>
<div id="accountLoggedOut">
<label for="accountEmail">E-MAIL</label>
<input id="accountEmail" type="email" autocomplete="email" placeholder="SEU@EMAIL.COM">
<label for="accountPassword">SENHA</label>
<input id="accountPassword" type="password" autocomplete="current-password" placeholder="SUA SENHA">
<div class="account-actions">
<button type="button" id="accountLogin">ENTRAR</button>

</div>
</div>
<div id="accountLoggedIn" hidden>
<p id="accountUser" class="account-user"></p>
<button type="button" id="accountLogout">SAIR</button>
</div>
<p class="account-status" id="accountStatus" role="status" aria-live="polite"></p>
</div>
</div></div>
<h1><span class="logo-type" data-text="COSMOS">COSMOS</span><span class="logo-type" data-text="TOOLS">TOOLS</span></h1>
<p class="subtitle">IDEAS IN THE MAKING.</p>
<nav class="tools" id="toolsNav" aria-label="COSMOS TOOLS" hidden>
<a class="tool-link" href="flavor-generator.html">FLAVOR GENERATOR</a>
<a class="tool-link" href="calculadora.html">RECIPE CALCULATOR</a>
</nav>
<footer class="footer-cosmos">
<div class="line-brand"><span class="logo-type" data-text="COSMOS">COSMOS</span></div>
<div class="line-tagline">NOT YOUR REGULAR COOKIE</div>
<div class="line-est">EST. 2024</div>
</footer>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
'use strict';
const SUPABASE_URL='https://gjotzkvhvdqhnaoxcgxv.supabase.co';
const SUPABASE_KEY='sb_publishable_MIgd-yrCkY1_JZln8pZQNw_AE3sog86';
const ALLOWED_EMAIL='cosmosconfeitaria@gmail.com';
const client=window.supabase?window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY):null;
const $=id=>document.getElementById(id);
const panel=$('accountPanel'),toggle=$('accountToggle');
toggle.addEventListener('click',()=>{panel.hidden=!panel.hidden});
let serverSessionReady=false;
async function syncServerSession(session){
 try{
  if(!session||!session.access_token){
   await fetch('/api/session',{method:'DELETE',credentials:'same-origin',cache:'no-store'});
   return false;
  }
  const response=await fetch('/api/session',{
   method:'POST',
   credentials:'same-origin',
   cache:'no-store',
   headers:{'Content-Type':'application/json'},
   body:JSON.stringify({access_token:session.access_token})
  });
  return response.ok;
 }catch(error){
  console.error('Não foi possível validar a sessão no servidor:',error);
  return false;
 }
}
function showSession(user){
 const authorized=serverSessionReady&&!!user&&String(user.email||'').toLowerCase()===ALLOWED_EMAIL;
 $('toolsNav').hidden=!authorized;
 $('accountLoggedOut').hidden=authorized;
 $('accountLoggedIn').hidden=!authorized;
 $('accountToggle').textContent=authorized?'MINHA CONTA':'LOGIN';
 $('accountHeading').textContent=authorized?'CONTA CONECTADA':'CONTA COSMOS';
 $('accountUser').textContent=authorized?(user.email||'CONECTADO'):'';
}
async function refresh(){
 if(!client){$('accountStatus').textContent='NÃO FOI POSSÍVEL CONECTAR À CONTA.';return}
 const {data,error}=await client.auth.getSession();
 if(error){serverSessionReady=false;showSession(null);$('accountStatus').textContent='ERRO AO VERIFICAR A SESSÃO.';return}
 const session=data.session||null;
 serverSessionReady=session?await syncServerSession(session):false;
 showSession(session?.user||null);
 if(session&&!serverSessionReady)$('accountStatus').textContent='NÃO FOI POSSÍVEL VALIDAR A SESSÃO. TENTE ENTRAR NOVAMENTE.';
}
$('accountLogin').addEventListener('click',async()=>{
 if(!client){$('accountStatus').textContent='NÃO FOI POSSÍVEL CONECTAR À CONTA.';return}
 const email=$('accountEmail').value.trim(),password=$('accountPassword').value;
 if(!email||!password){$('accountStatus').textContent='INFORME E-MAIL E SENHA.';return}
 if(email.toLowerCase()!==ALLOWED_EMAIL){$('accountStatus').textContent='ESTA CONTA NÃO TEM AUTORIZAÇÃO DE ACESSO.';return}
 $('accountStatus').textContent='ENTRANDO...';
 const {data,error}=await client.auth.signInWithPassword({email,password});
 if(error){
  $('accountStatus').textContent='NÃO FOI POSSÍVEL ENTRAR: '+error.message;
 }else{
  serverSessionReady=await syncServerSession(data.session);
  showSession(data.session?.user||null);
  $('accountStatus').textContent=serverSessionReady?'':'LOGIN REALIZADO, MAS NÃO FOI POSSÍVEL VALIDAR O ACESSO. TENTE NOVAMENTE.';
 }
});
$('accountLogout').addEventListener('click',async()=>{
 if(!client){$('accountStatus').textContent='NÃO FOI POSSÍVEL CONECTAR À CONTA.';return}
 $('accountStatus').textContent='SAINDO...';
 const {error}=await client.auth.signOut();
 if(error){
  $('accountStatus').textContent='ERRO AO SAIR: '+error.message;
 }else{
  serverSessionReady=false;
  await syncServerSession(null);
  showSession(null);
  $('accountStatus').textContent='VOCÊ SAIU DA CONTA.';
 }
});
if(client)client.auth.onAuthStateChange((_event,session)=>{
 Promise.resolve().then(async()=>{
  serverSessionReady=session?await syncServerSession(session):false;
  showSession(session?.user||null);
 });
});
if(new URLSearchParams(window.location.search).get('auth')==='required'){
 panel.hidden=false;
 $('accountStatus').textContent='FAÇA LOGIN PARA ACESSAR AS FERRAMENTAS.';
}
refresh();
})();
</script>
</body>
