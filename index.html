<style>
:root{--blue:#2263D2;--cream:#F6F4F1;--ink:#2D2D2D;--muted:#77736e;--line:#d4d1cc}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--cream);color:var(--ink);font-family:Helvetica,Arial,sans-serif;display:flex;flex-direction:column}
main{width:min(720px,100%);margin:auto;padding:38px 22px 24px;flex:1;display:flex;flex-direction:column;justify-content:center}
.topline{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:52px}
.brand{font-size:11px;letter-spacing:.18em;font-weight:900;color:var(--blue)}
.version{font-family:'Orbitron',monospace;font-size:8px;letter-spacing:.1em;color:#77736e}
h1{font-size:clamp(42px,10vw,76px);line-height:.9;letter-spacing:-.065em;margin:0;color:var(--blue);font-weight:900}
.subtitle{font-family:Helvetica,Arial,sans-serif;font-size:10px;font-weight:800;letter-spacing:.16em;color:var(--muted);margin:18px 0 48px}
.tools{display:grid;grid-template-columns:1fr;gap:22px;max-width:520px;margin:0 auto;width:100%}.tools[hidden]{display:none}
.tool-link{display:flex;align-items:center;justify-content:center;min-height:76px;padding:18px 22px;text-decoration:none;text-align:center;color:var(--blue);font-family:'Orbitron',Helvetica,Arial,sans-serif;font-size:clamp(11px,2.8vw,14px);font-weight:700;letter-spacing:.08em;border:1px solid #aaa8a3;border-radius:14px;background:linear-gradient(180deg,#fff 0%,#f0efed 18%,#d8d7d4 48%,#c5c4c1 52%,#e6e5e2 82%,#c9c8c5 100%);box-shadow:inset 0 2px 1px #fff,inset 0 -2px 2px #aaa9a6,0 5px 0 #a5a39e,0 8px 13px #00000012;text-shadow:none;transition:transform .12s ease,box-shadow .12s ease}
.tool-link:hover{filter:brightness(1.035);transform:translateY(-1px);box-shadow:inset 0 2px 1px #fff,inset 0 -2px 2px #aaa9a6,0 6px 0 #a5a39e,0 10px 15px #00000016}
.tool-link:active{transform:translateY(4px);box-shadow:inset 0 2px 1px #fff,0 1px 0 #a5a39e,0 3px 7px #00000012}

.account-area{position:relative}
.account-button,.account-actions button,#accountLogout{border:1px solid #aaa8a3;border-radius:9px;background:linear-gradient(180deg,#fff 0%,#f0efed 18%,#d8d7d4 48%,#c5c4c1 52%,#e6e5e2 82%,#c9c8c5 100%);color:var(--blue);font:800 9px Helvetica,Arial,sans-serif;letter-spacing:.08em;padding:9px 13px;box-shadow:inset 0 2px 1px #fff,0 3px 0 #a5a39e;cursor:pointer}
.account-button:active,.account-actions button:active,#accountLogout:active{background:linear-gradient(180deg,#dce8fb,#aebfdb 55%,#9fb3d5);transform:translateY(2px);box-shadow:inset 0 2px 1px #fff,0 1px 0 #929eaf}
.account-panel{position:absolute;right:0;top:calc(100% + 12px);z-index:20;width:min(310px,calc(100vw - 36px));padding:17px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px #00000018;text-align:left}
.account-panel[hidden]{display:none}
.account-heading{font-size:10px;font-weight:900;letter-spacing:.12em;color:var(--blue);margin-bottom:13px}
.account-panel label{display:block;font-size:9px;font-weight:800;letter-spacing:.08em;color:var(--muted);margin:10px 0 5px}
.account-panel input{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;font:12px Helvetica,Arial,sans-serif;color:var(--ink);background:#fff}
.account-actions{display:flex;gap:8px;margin-top:12px}
.account-user,.account-status{font-size:10px;line-height:1.5;color:var(--muted);overflow-wrap:anywhere}
.account-status{min-height:14px;margin:10px 0 0}
footer{text-align:center;padding:28px 12px 30px;display:grid;gap:7px}
footer .stars{font-size:12px;letter-spacing:.2em;color:var(--blue);font-weight:900}
footer .tagline{font-size:10px;letter-spacing:.15em;font-weight:900;color:var(--ink)}
footer .est{font-size:9px;letter-spacing:.13em;color:var(--muted)}
@media(min-width:600px){.tools{gap:26px}.tool-link{min-height:82px}}
@media(max-width:420px){main{padding:28px 18px 18px}.topline{margin-bottom:42px}.subtitle{margin-bottom:40px}.tool-link{min-height:70px}}

  border:1px solid #d4d0c7;

  transform:rotate(-.65deg);
  clip-path:polygon(0 0,100% 0,100% 92%,97% 94%,100% 97%,100% 100%,0 100%,0 97%,3% 94%,0 91%);
}
.ticket-card:nth-child(2){transform:rotate(.7deg)}
.ticket-card:before{
  content:"";
  position:absolute;
  top:-5px;
  left:43%;
  width:72px;
  height:17px;
  background:linear-gradient(180deg,#ffffffa8,#dfe5e5a1);
  border:1px solid #ffffff75;
  box-shadow:0 1px 2px #00000012;

}
.ticket-no,.ticket-foot{

  font-size:7px;

}
.ticket-no{margin:0 0 10px 3px}
.ticket-foot{
  margin:11px 2px 0;

  border-top:1px dashed #aaa69d;
  text-align:center;

  font-size:8px;
}
.tool-link{
  position:relative;
  min-height:70px;
  border-radius:8px;
  border:1px solid #a9a8a5;
  background:linear-gradient(180deg,#fff 0%,#f0efed 18%,#d8d7d4 48%,#c5c4c1 52%,#e6e5e2 82%,#c9c8c5 100%);
  box-shadow:inset 0 2px 1px #fff,inset 0 -2px 2px #aaa9a6,0 4px 0 #a5a39e,0 7px 12px #00000018;
  color:var(--blue);
  font-family:'Orbitron',Helvetica,Arial,sans-serif;
  letter-spacing:.1em;
  text-shadow:0 1px 0 #fff;
}
.tool-link:hover{filter:brightness(1.04);transform:translateY(-1px);box-shadow:inset 0 2px 1px #fff,inset 0 -2px 2px #aaa9a6,0 5px 0 #a5a39e,0 9px 14px #00000020}
.tool-link:active{transform:translateY(3px);box-shadow:inset 0 2px 1px #fff,0 1px 0 #a5a39e,0 3px 7px #00000012}
footer{padding:26px 12px 28px}
footer .stars{color:#fff;text-shadow:0 2px 0 #16489d}
footer .tagline{color:#fff}
footer .est{color:#e1e9f8}
@media(max-width:420px){
  main{padding:25px 18px 20px}
  .topline{margin-bottom:38px}
  .subtitle{margin-bottom:32px}
  .ticket-card{padding:18px 14px 12px}
  .tool-link{min-height:66px}
}

</style>
</head>

<main>
<div class="topline"><div class="brand">COSMOS COOKIE LAB</div><div class="account-area">
<button class="account-button" id="accountToggle" type="button">LOGIN</button>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
'use strict';
const SUPABASE_URL='https://gjotzkvhvdqhnaoxcgxv.supabase.co';
const SUPABASE_KEY='sb_publishable_MIgd-yrCkY1_JZln8pZQNw_AE3sog86';
const ALLOWED_EMAIL='cosmosconfeitaria@gmail.com';
const client=window.supabase?window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY):null;
const $=id=>document.getElementById(id);
const panel=$('accountPanel'),toggle=$('accountToggle');
toggle.addEventListener('click',()=>{panel.hidden=!panel.hidden});
let serverSessionReady=false;
async function syncServerSession(session){
 try{
  if(!session||!session.access_token){
   await fetch('/api/session',{method:'DELETE',credentials:'same-origin',cache:'no-store'});
   return false;
  }
  const response=await fetch('/api/session',{
   method:'POST',
   credentials:'same-origin',
   cache:'no-store',
   headers:{'Content-Type':'application/json'},
   body:JSON.stringify({access_token:session.access_token})
  });
  return response.ok;
 }catch(error){
  console.error('Não foi possível validar a sessão no servidor:',error);
  return false;
 }
}
function showSession(user){
 const authorized=serverSessionReady&&!!user&&String(user.email||'').toLowerCase()===ALLOWED_EMAIL;
 $('toolsNav').hidden=!authorized;
 $('accountLoggedOut').hidden=authorized;
 $('accountLoggedIn').hidden=!authorized;
 $('accountToggle').textContent=authorized?'MINHA CONTA':'LOGIN';
 $('accountHeading').textContent=authorized?'CONTA CONECTADA':'CONTA COSMOS';
 $('accountUser').textContent=authorized?(user.email||'CONECTADO'):'';
}
async function refresh(){
 if(!client){$('accountStatus').textContent='NÃO FOI POSSÍVEL CONECTAR À CONTA.';return}
 const {data,error}=await client.auth.getSession();
 if(error){serverSessionReady=false;showSession(null);$('accountStatus').textContent='ERRO AO VERIFICAR A SESSÃO.';return}
 const session=data.session||null;
 serverSessionReady=session?await syncServerSession(session):false;
 showSession(session?.user||null);
 if(session&&!serverSessionReady)$('accountStatus').textContent='NÃO FOI POSSÍVEL VALIDAR A SESSÃO. TENTE ENTRAR NOVAMENTE.';
}
$('accountLogin').addEventListener('click',async()=>{
 if(!client){$('accountStatus').textContent='NÃO FOI POSSÍVEL CONECTAR À CONTA.';return}
 const email=$('accountEmail').value.trim(),password=$('accountPassword').value;
 if(!email||!password){$('accountStatus').textContent='INFORME E-MAIL E SENHA.';return}
 if(email.toLowerCase()!==ALLOWED_EMAIL){$('accountStatus').textContent='ESTA CONTA NÃO TEM AUTORIZAÇÃO DE ACESSO.';return}
 $('accountStatus').textContent='ENTRANDO...';
 const {data,error}=await client.auth.signInWithPassword({email,password});
 if(error){
  $('accountStatus').textContent='NÃO FOI POSSÍVEL ENTRAR: '+error.message;
 }else{
  serverSessionReady=await syncServerSession(data.session);
  showSession(data.session?.user||null);
  $('accountStatus').textContent=serverSessionReady?'':'LOGIN REALIZADO, MAS NÃO FOI POSSÍVEL VALIDAR O ACESSO. TENTE NOVAMENTE.';
 }
});
$('accountLogout').addEventListener('click',async()=>{
 if(!client){$('accountStatus').textContent='NÃO FOI POSSÍVEL CONECTAR À CONTA.';return}
 $('accountStatus').textContent='SAINDO...';
 const {error}=await client.auth.signOut();
 if(error){
  $('accountStatus').textContent='ERRO AO SAIR: '+error.message;
 }else{
  serverSessionReady=false;
  await syncServerSession(null);
  showSession(null);
  $('accountStatus').textContent='VOCÊ SAIU DA CONTA.';
 }
});
if(client)client.auth.onAuthStateChange((_event,session)=>{
 Promise.resolve().then(async()=>{
  serverSessionReady=session?await syncServerSession(session):false;
  showSession(session?.user||null);
 });
});
if(new URLSearchParams(window.location.search).get('auth')==='required'){
 panel.hidden=false;
 $('accountStatus').textContent='FAÇA LOGIN PARA ACESSAR AS FERRAMENTAS.';
}
refresh();
})();
</script>
